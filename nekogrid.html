<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥그림판</title>
    <link rel="icon" href="soha.png">
</head>
<body style="background-color: black;">
    <div style="text-align: center;">
        <label for="brush" style="color: aqua;">색 고르기</label>
        <input id="brush" type="color" value="#ffff00">
        <br>
        <br>
        <canvas id="nekogrid">

        </canvas>
    </div>
    <script>
        const scale = 32;
        const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
        const pixelSize = size / scale;
        const margin = 1;

        const input = document.getElementById('brush');
        const canvas = document.getElementById('nekogrid');
        const context = canvas.getContext('2d');
        const socket = new WebSocket("ws://203.245.28.89:8080");
        canvas.width = size;
        canvas.height = size;
        let brush = 'ffff00';
        let previousRequest = '';
        let down = false;
        let id = -1;
        input.addEventListener('input', (e) => {
            brush = input.value.substr(1);
        })
        canvas.addEventListener('mousemove', (e) => {
            const rectangle = canvas.getBoundingClientRect();
            let mouseX = 0;
            let mouseY = 0;
            mouseX = e.clientX - rectangle.left;
            mouseY = e.clientY - rectangle.top;
            mouseX /= pixelSize;
            mouseY /= pixelSize;
            mouseX = Math.floor(mouseX);
            mouseY = Math.floor(mouseY);
            if (mouseX < 0 || mouseY < 0 || mouseX >= scale || mouseY >= scale) {
                id = -1;
                return;
            }
            id = mouseX + mouseY * scale;
            const request = JSON.stringify({
                i: id,
                color: brush,
            });
            if (!down || request === previousRequest) {
                return;
            }
            socket.send(request);
        });
        canvas.addEventListener('mousedown', (e) => {
            down = true;
                if (id >= 0) {
                    const request = JSON.stringify({
                    i: id,
                    color: brush,
                });
                if (!down || request === previousRequest) {
                    return;
                }
                socket.send(request);
            }
        });
        canvas.addEventListener('mouseup', (e) => {
            down = false;
        });
        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            switch (data.type) {
            case 'refresh':
                context.reset();
                context.fillStyle = 'black';
                context.fillRect(0, 0, size, size);
                let iGrid = 0;
                let ix = 0;
                let iy = 0;
                for (let i = 0; i < scale * scale; i++) {
                    context.fillStyle = '#' + data.grid.substr(iGrid, 6);
                context.fillRect(ix * pixelSize + margin, iy * pixelSize + margin, pixelSize - 2 * margin, pixelSize - 2 * margin);
                    iGrid += 6;
                    ix++;
                    if (ix >= scale) {
                        ix = 0;
                        iy++;
                    }
                }
                break;
            case 'update':
                const x = data.i % scale;
                const y = (data.i - x) / scale;
                context.fillStyle = '#' + data.color;
                context.fillRect(x * pixelSize + margin, y * pixelSize + margin, pixelSize - 2 * margin, pixelSize - 2 * margin);
                break;
            }
        };
    </script>
</body>
</html>
